name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Tampilkan SHA keystore
        run: keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA1|SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore      
      - name: Verifikasi app/google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "ERROR: app/google-services.json tidak ditemukan di repository GitHub! Upload file app/google-services.json agar layanan Firebase aktif di APK."
            exit 1
          fi
          grep -q '"package_name": "com.aistudio.soundingtangki.ixuqmt"' app/google-services.json || {
            echo "ERROR: package_name di app/google-services.json tidak cocok dengan applicationId com.aistudio.soundingtangki.ixuqmt"
            exit 1
          }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sounding-tangki-apk
          path: "**/build/outputs/apk/debug/*.apk"
