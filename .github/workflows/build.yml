name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Tampilkan SHA keystore
        run: keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA1|SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
      - name: Verifikasi app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -f google-services.json ]; then
            echo "INFO: Menyalin google-services.json dari root ke app/google-services.json"
            cp google-services.json app/google-services.json || true
          fi

          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "INFO: Membuat app/google-services.json dari GitHub Secret GOOGLE_SERVICES_JSON"
            python3 - <<'PY' || true
          import base64, json, os
          try:
              raw = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
              try:
                  json.loads(raw)
                  content = raw
              except Exception:
                  content = base64.b64decode(raw).decode("utf-8")
                  json.loads(content)
              with open("app/google-services.json", "w", encoding="utf-8") as f:
                  f.write(content)
              print("OK: app/google-services.json berhasil dibuat dari secret GOOGLE_SERVICES_JSON")
          except Exception as exc:
              print(f"::warning::Gagal memproses secret GOOGLE_SERVICES_JSON: {exc}")
          PY
          fi

          python3 - <<'PY' || true
          import json, os, re

          gs_path = "app/google-services.json"
          gradle_path = "app/build.gradle.kts"

          if not os.path.isfile(gs_path):
              app_files = sorted(os.listdir("app")) if os.path.isdir("app") else []
              print("::warning::app/google-services.json belum ada di repository GitHub. Build APK tetap dilanjutkan (mode offline). Untuk mengaktifkan Firebase Cloud di APK GitHub, unggah app/google-services.json ke folder app/ atau tambahkan secret GOOGLE_SERVICES_JSON.")
              print(f"INFO: Isi folder app/ saat ini: {app_files}")
          else:
              app_id = ""
              if os.path.isfile(gradle_path):
                  with open(gradle_path, "r", encoding="utf-8") as f:
                      match = re.search(r'applicationId\s*=\s*"([^"]+)"', f.read())
                      if match:
                          app_id = match.group(1).strip()
              try:
                  with open(gs_path, "r", encoding="utf-8-sig") as f:
                      data = json.load(f)
                  project_id = (data.get("project_info") or {}).get("project_id", "").strip()
                  packages = [
                      (((c.get("client_info") or {}).get("android_client_info") or {}).get("package_name") or "").strip()
                      for c in (data.get("client") or [])
                  ]
                  if app_id and app_id in packages:
                      print(f"OK: app/google-services.json valid untuk applicationId='{app_id}' (project_id='{project_id}')")
                  else:
                      print(f"::warning::package_name {packages} berbeda dengan applicationId '{app_id}'. Build tetap dilanjutkan.")
              except Exception as exc:
                  print(f"::warning::app/google-services.json tidak dapat diparsing ({exc}). Build tetap dilanjutkan.")
          PY
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sounding-tangki-apk
          path: "**/build/outputs/apk/debug/*.apk"
